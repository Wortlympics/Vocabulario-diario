<style>
  :root{
    --cream:#FBF6EE; --cream2:#F3E9D8; --brown:#4A2E1F; --brown-light:#7A5240;
    --amber:#B8860B; --amber-dark:#8C6608; --navy:#1F3864; --green:#2E7D4F;
    --red:#B23A3A; --grey:#8A7F72; --white:#FFFFFF;
    --shadow: 0 4px 20px rgba(74,46,31,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background: linear-gradient(180deg,#FBF6EE 0%, #F3E9D8 100%);
    color:var(--brown);
    min-height:100vh;
    padding:16px;
  }
  .app{max-width:480px; margin:0 auto;}
  .card-surface{
    background:var(--white); border-radius:20px; box-shadow:var(--shadow);
    padding:24px; margin-bottom:16px;
  }
  h1{font-size:1.4rem; margin:0 0 4px; color:var(--brown);}
  .subtitle{color:var(--grey); font-size:0.9rem; margin-bottom:16px;}
  .greeting{
    display:flex; align-items:center; gap:10px; margin-bottom:6px;
  }
  .greeting .emoji{font-size:2rem;}
  .stat-row{display:flex; gap:10px; margin:16px 0;}
  .stat-box{
    flex:1; background:var(--cream2); border-radius:14px; padding:12px 8px;
    text-align:center;
  }
  .stat-num{font-size:1.5rem; font-weight:800; color:var(--amber-dark);}
  .stat-label{font-size:0.7rem; color:var(--grey); margin-top:2px; text-transform:uppercase; letter-spacing:0.03em;}
  .btn{
    display:block; width:100%; border:none; border-radius:14px; padding:16px;
    font-size:1.05rem; font-weight:700; cursor:pointer; text-align:center;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--amber); color:#fff;}
  .btn-secondary{background:var(--cream2); color:var(--brown);}
  .btn-outline{background:transparent; border:2px solid var(--cream2); color:var(--brown-light);}
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .btn-row .btn{flex:1;}
  .btn-ok{background:var(--green); color:#fff;}
  .btn-no{background:var(--red); color:#fff;}
  .btn:disabled{opacity:0.5; cursor:default;}

  .heatmap{display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; margin-top:10px;}
  .heat-cell{aspect-ratio:1; border-radius:4px; background:var(--cream2);}
  .heat-0{background:#EFE6D6;}
  .heat-1{background:#E3C98A;}
  .heat-2{background:#D4A94D;}
  .heat-3{background:var(--amber-dark);}

  .flip-card{
    margin-bottom:6px;
  }
  .flip-inner{
    position:relative; width:100%; text-align:center; border-radius:20px;
  }
  .flip-face{
    width:100%; min-height:180px;
    border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; box-shadow:var(--shadow); position:relative;
  }
  .flip-front{background:var(--white);}
  .flip-back{background:var(--navy); color:#fff;}
  .tag{
    position:absolute; top:14px; left:16px; font-size:0.65rem; font-weight:800;
    letter-spacing:0.05em; text-transform:uppercase; opacity:0.6;
  }
  .progress-count{
    position:absolute; top:14px; right:16px; font-size:0.7rem; opacity:0.6; font-weight:600;
  }
  .word-main{font-size:1.9rem; font-weight:800; color:var(--navy); margin-bottom:8px;}
  .flip-back .word-main{color:#fff;}
  .word-info{font-size:0.85rem; color:var(--grey); font-style:italic;}
  .word-cat{font-size:0.7rem; color:var(--grey); margin-top:14px;}
  .tap-hint{font-size:0.75rem; color:var(--grey); text-align:center; margin-bottom:16px;}

  .progress-bar-track{
    height:6px; background:var(--cream2); border-radius:3px; overflow:hidden; margin:14px 0;
  }
  .progress-bar-fill{height:100%; background:var(--amber); transition:width 0.3s ease;}

  .reward-bar-wrap{ position:relative; margin:34px 0 18px; }
  .reward-bar-track{ height:10px; background:var(--cream2); border-radius:5px; overflow:hidden; }
  .reward-bar-fill{ height:100%; background:linear-gradient(90deg, var(--amber), #E8A33D); transition:width 0.4s ease; }
  .reward-icon{
    position:absolute; top:-24px; transform:translateX(-50%);
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:1rem; border:2px solid var(--white); box-shadow:0 2px 6px rgba(0,0,0,0.15);
    cursor:default; background:var(--cream2); opacity:0.55;
  }

  Ben: { rewards: REWARDS_HEIKO, icon: '💡', modalEmoji: '💡', label: 'dato curioso', unlockedText: '💡 ¡Has desbloqueado todos los datos curiosos!' },
};

function renderRewardBar(masteredTotal){
  const set = REWARD_SETS[currentProfile];
  if(!set) return '';
  const rewards = set.rewards;
  const maxMilestone = rewards[rewards.length - 1].milestone;
  const pct = Math.min(100, (masteredTotal / maxMilestone) * 100);
  const icons = rewards.map((r, i) => {
    const unlocked = masteredTotal >= r.milestone;
    const left = (r.milestone / maxMilestone) * 100;
    return `<div class="reward-icon ${unlocked ? 'unlocked' : ''}" style="left:${left}%;" data-reward-idx="${i}" data-unlocked="${unlocked}">${unlocked ? set.icon : '🔒'}</div>`;
  }).join('');
  const nextMilestone = rewards.find(r => masteredTotal < r.milestone);
  const useDE = currentProfile === 'Heiko' || currentProfile === 'Ben';
  const statusLine = nextMilestone
    ? (useDE
        ? `🎁 Noch <b>${nextMilestone.milestone - masteredTotal}</b> Wörter bis zur nächsten Belohnung`
        : `🎁 Te faltan <b>${nextMilestone.milestone - masteredTotal}</b> palabras para la siguiente recompensa`)
    : (useDE ? `🎁 Alle Belohnungen freigeschaltet!` : `🎁 ¡Has desbloqueado todas las recompensas!`);
  return `
    <div class="reward-bar-wrap">
      <div class="reward-bar-track"><div class="reward-bar-fill" style="width:${pct}%"></div></div>
      ${icons}
    </div>
    <div class="subtitle" style="margin-bottom:0;">${statusLine}</div>
  `;
}

function wireRewardIcons(){
  document.querySelectorAll('.reward-icon').forEach(icon => {
    icon.onclick = () => {
      if(icon.dataset.unlocked === 'true'){
        showRewardModal(Number(icon.dataset.rewardIdx));
      }
    };
  });
}

function showRewardModal(idx){
  const set = REWARD_SETS[currentProfile];
  if(!set) return;
  const r = set.rewards[idx];
  const backdrop = document.createElement('div');
  backdrop.className = 'reward-modal-backdrop';
  backdrop.innerHTML = `
    <div class="reward-modal-card">
      <div style="font-size:3.5rem; margin-bottom:10px;">${set.modalEmoji}</div>
      <div style="font-size:1.15rem; font-weight:800; color:var(--brown); line-height:1.5;">${r.text} ${r.emoji}</div>
      <div class="subtitle" style="margin:10px 0 20px;">Hito de ${r.milestone} palabras dominadas</div>
      <button class="btn btn-primary" id="closeRewardModal">¡Genial!</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.querySelector('#closeRewardModal').onclick = close;
  backdrop.onclick = (e) => { if(e.target === backdrop) close(); };
}

// ---------- Casual password gate per profile (not real security, just privacy) ----------
function loadUserPassword(p){
  try{ return localStorage.getItem(`aleman_pw_${p}`); }catch(e){ return null; }
}
function saveUserPassword(p, pw){
  try{ localStorage.setItem(`aleman_pw_${p}`, pw); }catch(e){}
}
function clearUserPassword(p){
  try{ localStorage.removeItem(`aleman_pw_${p}`); }catch(e){}
}
function isDeviceVerified(p){
  try{ return localStorage.getItem(`aleman_pw_verified_${p}`) === 'true'; }catch(e){ return false; }
}
function markDeviceVerified(p){
  try{ localStorage.setItem(`aleman_pw_verified_${p}`, 'true'); }catch(e){}
}
function forgetDeviceVerified(p){
  try{ localStorage.removeItem(`aleman_pw_verified_${p}`); }catch(e){}
}

function renderPasswordGate(p){
  const existing = loadUserPassword(p);
  if(existing === null){
    renderPasswordSetup(p);
  } else if(isDeviceVerified(p)){
    goToProfile(p); // already unlocked once on this device, skip straight in
  } else {
    renderPasswordLogin(p, existing);
  }
}

      <div id="pwLoginError" style="color:var(--red); font-size:0.85rem; display:none; margin-bottom:10px;">Contraseña incorrecta. / Falsches Passwort.</div>

      <div style="font-size:0.72rem; color:var(--grey); margin-top:2px;">Abbrechen</div>
      <button id="pwForgotBtn" style="background:none; border:none; color:var(--grey); font-size:0.82rem; margin-top:14px; cursor:pointer;">¿Olvidaste tu contraseña? Restablecer</button>
      <div style="font-size:0.72rem; color:var(--grey); margin-top:2px;">Passwort vergessen? Zurücksetzen</div>

  input.focus();

// ---------- Medallero: cumulative gold/silver/bronze from monthly history ----------
function computeMedalTable(cloudData){
  const mk = currentMonthKey();
  const currentYear = mk.slice(0, 4);
  const monthsSeen = new Set();
  Object.keys(PROFILES).forEach(p => {
    const d = cloudData && cloudData[p];
    if(d && d.monthlyHistory){
      Object.keys(d.monthlyHistory).forEach(m => monthsSeen.add(m));
    }
  });
  // Only fully completed months count — the current month is still in progress —
  // and only months from THIS calendar year: the medallero resets every January.
  const completedMonths = [...monthsSeen].filter(m => m < mk && m.startsWith(currentYear)).sort();

  const tally = {};
  Object.keys(PROFILES).forEach(p => { tally[p] = {gold:0, silver:0, bronze:0}; });

  completedMonths.forEach(month => {
    const ranked = Object.keys(PROFILES)
      .map(p => {
        const d = cloudData && cloudData[p];
        const val = (d && d.monthlyHistory && d.monthlyHistory[month]) || 0;
        return {p, val};
      })
      .filter(x => x.val > 0)
      .sort((a,b) => b.val - a.val);
    if(ranked[0]) tally[ranked[0].p].gold++;
    if(ranked[1]) tally[ranked[1].p].silver++;
    if(ranked[2]) tally[ranked[2].p].bronze++;
  });

  return { tally, completedMonths };
}

async function loadLandingStats(){
  const cloudData = await cloudFetch();
  const mk = currentMonthKey();
  const medals = ['🥇', '🥈', '🥉'];

  function monthlyMasteredCount(p){
    if(!cloudData || !cloudData[p]) return -1;
    const d = cloudData[p];
    if(d.monthKey !== mk) return 0; // stale from a previous month until they resync
    return d.monthlyMastered || 0;
  }

  // Only the top 3 get a medal — no full ranking, so nobody sees themselves as "last"
  const ranked = Object.keys(PROFILES)
    .map(p => ({ p, monthly: monthlyMasteredCount(p) }))
    .filter(x => x.monthly > 0)
    .sort((a, b) => b.monthly - a.monthly);
  const medalFor = {};
  ranked.forEach((x, i) => { if(i < 3) medalFor[x.p] = medals[i]; });

  Object.keys(PROFILES).forEach(p => {
    const nameEl = document.querySelector(`.landing-name-${p}`);
    if(nameEl) nameEl.textContent = (medalFor[p] ? medalFor[p] + ' ' : '') + PROFILES[p].name;

    const el = document.querySelector(`.landing-stats-${p}`);
    if(!el) return; // user already navigated away
    if(!cloudData || !cloudData[p]){
      el.textContent = 'Sin datos sincronizados todavía';
      return;
    }
    const d = cloudData[p];
    const mastered = Object.values(d.progress || {}).filter(s => s.box >= 4).length;
    const monthly = d.monthKey === mk ? (d.monthlyMastered || 0) : 0;
    const isDE = PROFILES[p].direction === 'es-de';
    const streakWord = isDE ? 'Serie' : 'racha';
    const masteredWord = isDE ? 'gemeistert' : 'dominadas';
    const monthWord = isDE ? 'diesen Monat' : 'este mes';
    el.innerHTML = `
      <span style="display:inline-flex; align-items:center; gap:4px;">🔥 ${streakWord} <b style="color:var(--brown);">${d.streak || 0}</b></span>
      <span style="margin:0 4px; color:var(--cream2);">·</span>
      <span style="display:inline-flex; align-items:center; gap:4px;">✅ <b style="color:var(--brown);">${mastered}</b> ${masteredWord}</span>
      ${monthly > 0 ? `<span style="display:inline-block; margin-left:6px; padding:2px 8px; border-radius:10px; background:var(--cream2); color:var(--amber-dark); font-size:0.78em; font-weight:700;">+${monthly} ${monthWord}</span>` : ''}
    `;
  });
}

async function loadCoupleStats(){
  const box = document.getElementById('coupleStatsBox');
  if(!box) return; // user may have navigated away already
  const cloudData = await cloudFetch();
  if(!box.isConnected) return; // screen changed while we waited
  if(!cloudData){
    box.innerHTML = `
      <div class="empty-state">📡 No se pudo conectar con el progreso compartido.<br>Se están usando los datos guardados en este dispositivo.</div>
      <button class="btn btn-outline" id="retrySyncBtn" style="margin-top:10px;">🔄 Reintentar</button>
    `;
    document.getElementById('retrySyncBtn').onclick = loadCoupleStats;
    return;
  }
  const rows = Object.keys(PROFILES).map(p => {
    const d = cloudData[p];
    const mastered = d ? Object.values(d.progress || {}).filter(s => s.box >= 4).length : 0;
    const strk = d ? (d.streak || 0) : 0;
    return `
      <div class="stat-box" style="flex:1;">
        <div style="font-weight:800; color:var(--brown); margin-bottom:4px;">${PROFILES[p].name}</div>
        <div class="stat-num"><span class="icon-flame">🔥</span>${strk}</div>
        <div class="stat-label">${mastered} dominadas</div>
      </div>
    `;
  }).join('');
  box.innerHTML = `
    <div class="subtitle" style="margin-bottom:10px;">☁️ Progreso del equipo (sincronizado)</div>
    <div class="stat-row" style="margin-bottom:0;">${rows}</div>
    <div class="footer-note" style="text-align:left; margin-top:10px;">
      <button class="btn btn-outline" id="retrySyncBtn" style="width:auto; padding:8px 14px; margin-bottom:0;">🔄 Actualizar</button>
    </div>
  `;
  const retryBtn = document.getElementById('retrySyncBtn');
  if(retryBtn) retryBtn.onclick = loadCoupleStats;
}

function renderGrammarTopic(level, topicIdx, tab){
  const lang = grammarLangFor(currentProfile);
  const topic = GRAMMAR[lang][level][topicIdx];
  app.innerHTML = `
    <div class="card-surface">
      <button class="btn btn-outline" id="backToTopicsBtn" style="margin-bottom:14px;">← ${LEVEL_LABELS[level]}</button>
      <h1 style="margin-bottom:4px;">${topic.title}</h1>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn ${tab==='theory' ? 'btn-primary' : 'btn-secondary'}" id="tabTheory">📘 Teoría</button>
        <button class="btn ${tab==='exercises' ? 'btn-primary' : 'btn-secondary'}" id="tabExercises">✏️ Ejercicios</button>
      </div>
    </div>
    <div class="card-surface" id="grammarContent"></div>
  `;
  document.getElementById('backToTopicsBtn').onclick = () => renderGrammarTopics(level);
  document.getElementById('tabTheory').onclick = () => renderGrammarTopic(level, topicIdx, 'theory');
  document.getElementById('tabExercises').onclick = () => renderGrammarTopic(level, topicIdx, 'exercises');

  const content = document.getElementById('grammarContent');
  if(tab === 'theory'){
    content.innerHTML = `<div style="line-height:1.7; font-size:0.98rem;">${topic.theory}</div>`;
  } else {
    content.innerHTML = topic.exercises.map((ex, i) => `
      <div style="border-bottom:1px solid var(--cream2); padding:14px 0;">
        <div style="font-weight:600; margin-bottom:10px;">${i+1}. ${ex.prompt}</div>
        <div style="display:flex; gap:8px;">
          <input type="text" class="grammar-answer" data-idx="${i}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
            style="flex:1; padding:10px; font-size:1rem; border-radius:10px; border:2px solid var(--cream2);">
          <button class="btn btn-primary grammar-check" data-idx="${i}" style="width:auto; padding:10px 16px;">✓</button>
        </div>
        <div class="grammar-feedback" data-idx="${i}" style="margin-top:8px; font-size:0.9rem; display:none;"></div>
      </div>
    `).join('');
    document.querySelectorAll('.grammar-check').forEach(btn=>{
      btn.onclick = () => checkGrammarExercise(topic.exercises, Number(btn.dataset.idx));
    });
    document.querySelectorAll('.grammar-answer').forEach(input=>{
      input.onkeydown = (e) => { if(e.key === 'Enter') checkGrammarExercise(topic.exercises, Number(input.dataset.idx)); };
    });
  }
}

function checkGrammarExercise(exercises, idx){
  const input = document.querySelector(`.grammar-answer[data-idx="${idx}"]`);
  const fb = document.querySelector(`.grammar-feedback[data-idx="${idx}"]`);
  const ex = exercises[idx];
  const isCorrect = isAnswerCorrect(input.value, ex.answer);
  input.style.borderColor = isCorrect ? 'var(--green)' : 'var(--red)';
  fb.style.display = 'block';
  fb.innerHTML = isCorrect
    ? `<span style="color:var(--green); font-weight:700;">✓ Correcto</span>`
    : `<span style="color:var(--red); font-weight:700;">✗ Respuesta: ${ex.answer}</span>`;
}

    const raw = localStorage.getItem(profileKey('progress'));
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
async function saveProgress(p){
  try{ localStorage.setItem(profileKey('progress'), JSON.stringify(p)); }catch(e){}
}
function currentMonthKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function ensureMonthlyReset(s){
  const mk = currentMonthKey();
  if(!s.monthlyHistory) s.monthlyHistory = {};
  if(s.monthKey && s.monthKey !== mk){
    // Archive the month that just ended so the medal table can use it later.
    s.monthlyHistory[s.monthKey] = s.monthlyMastered || 0;
  }
  if(s.monthKey !== mk){
    s.monthKey = mk;
    s.monthlyMastered = 0;
  }
  if(typeof s.monthlyMastered !== 'number') s.monthlyMastered = 0;
  return s;
}

async function loadStreak(){
  try{
    const raw = localStorage.getItem(profileKey('streak'));
    const parsed = raw ? JSON.parse(raw) : {current:0, longest:0, lastDate:null, history:{}, totalReviews:0, monthlyMastered:0, monthKey:null, monthlyHistory:{}};
    if(typeof parsed.totalReviews !== 'number') parsed.totalReviews = 0;
    ensureMonthlyReset(parsed);
    return parsed;
  }catch(e){ return {current:0, longest:0, lastDate:null, history:{}, totalReviews:0, monthlyMastered:0, monthKey:currentMonthKey(), monthlyHistory:{}}; }
}
async function saveStreak(s){
  try{ localStorage.setItem(profileKey('streak'), JSON.stringify(s)); }catch(e){}
}
function loadCategories(){
  try{
    const raw = localStorage.getItem(profileKey('categories'));
    return raw ? JSON.parse(raw) : null; // null = all categories
  }catch(e){ return null; }
}
function saveCategories(cats){
  try{ localStorage.setItem(profileKey('categories'), JSON.stringify(cats)); }catch(e){}
}
function loadMistakes(){
  try{
    const raw = localStorage.getItem(profileKey('mistakes'));
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveMistakes(list){

}

const JSONBIN_ID = "6a510a61f5f4af5e297d44ef";

const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;
let lastSyncStatus = null; // 'ok' | 'error' | null (never tried)
let lastSyncTime = null;

async function cloudFetch(){
  try{
    const res = await fetch(`${JSONBIN_URL}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if(!res.ok) throw new Error('fetch failed: ' + res.status);
    const data = await res.json();
    lastSyncStatus = 'ok';
    lastSyncTime = new Date();
    return data.record || {};
  }catch(e){
    lastSyncStatus = 'error';
    return null;
  }
}

async function cloudPush(fullData){
  try{
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify(fullData),
    });
    if(!res.ok) throw new Error('push failed: ' + res.status);
    lastSyncStatus = 'ok';
    lastSyncTime = new Date();
    return true;
  }catch(e){
    lastSyncStatus = 'error';
    return false;
  }
}

async function syncProfileToCloud(){
  const cloudData = (await cloudFetch()) || {};
  cloudData[currentProfile] = {
    streak: streak.current,
    longest: streak.longest,
    lastDate: streak.lastDate,
    history: streak.history,
    totalReviews: streak.totalReviews || 0,
    monthlyMastered: streak.monthlyMastered || 0,
    monthKey: streak.monthKey || currentMonthKey(),
    monthlyHistory: streak.monthlyHistory || {},
    progress: progress,
    mistakes: mistakes,
    updatedAt: new Date().toISOString(),
  };
  await cloudPush(cloudData);
}

async function pullProfileFromCloud(){
  const cloudData = await cloudFetch();
  if(cloudData && cloudData[currentProfile]){
    const remote = cloudData[currentProfile];
    progress = remote.progress || {};
    streak = {current: remote.streak||0, longest: remote.longest||0, lastDate: remote.lastDate||null, history: remote.history||{}, totalReviews: remote.totalReviews||0, monthlyMastered: remote.monthlyMastered||0, monthKey: remote.monthKey||null, monthlyHistory: remote.monthlyHistory||{}};
    ensureMonthlyReset(streak);
    mistakes = remote.mistakes || [];
    await saveProgress(progress);
    await saveStreak(streak);
    saveMistakes(mistakes);
    return true;
  }
  return false;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  const d1 = new Date(a+'T00:00:00'), d2 = new Date(b+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function getFilteredIndices(){
  const catAll = !selectedCategories || selectedCategories.length === 0 || selectedCategories.length === ALL_CATEGORIES.length;
  const lvlAll = !selectedLevels || selectedLevels.length === 0 || selectedLevels.length === ALL_LEVELS.length;
  if(catAll && lvlAll){
    return DECK.map((_, idx) => idx);
  }
  const catSet = catAll ? null : new Set(selectedCategories);
  const lvlSet = lvlAll ? null : new Set(selectedLevels);
  const out = [];
  DECK.forEach((card, idx) => {
    if(catSet && !catSet.has(card.cat)) return;
    if(lvlSet && !lvlSet.has(card.lvl)) return;
    out.push(idx);
  });
  return out;
}

const IN_PROGRESS_CAP = 100;

function getDueCards(){
  const today = todayStr();
  const indices = getFilteredIndices();
  const due = [];
  const fresh = [];
  indices.forEach(idx=>{
    const card = DECK[idx];
    const st = progress[idx];
    if(!st){ fresh.push(idx); }
    else if(st.due <= today){ due.push(idx); }
  });
  // prioritize reviews due, then fill with fresh new words — unless the
  // in-progress cap has been reached, in which case only due reviews are offered.
  const queue = due.slice(0, SESSION_SIZE);
  if(queue.length < SESSION_SIZE && countInProgress() < IN_PROGRESS_CAP){
    queue.push(...fresh.slice(0, SESSION_SIZE - queue.length));
  }
  return queue;
}

function countMastered(){
  const indices = new Set(getFilteredIndices());
  return Object.entries(progress).filter(([idx, s]) => indices.has(Number(idx)) && s.box >= 4).length;
}
function countInProgress(){
  const indices = new Set(getFilteredIndices());
  return Object.entries(progress).filter(([idx, s]) => indices.has(Number(idx)) && s.box >= 1 && s.box < 4).length;
}
function countReviewedTotal(){
  const indices = new Set(getFilteredIndices());
  return Object.keys(progress).filter(idx => indices.has(Number(idx))).length;
}
function deckSizeForStats(){
  return getFilteredIndices().length;
}

function renderHeatmap(history){
  let cells = '';
  const today = new Date();
  for(let i=29; i>=0; i--){
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const count = history[key] || 0;
    let cls = 'heat-0';
    if(count >= 1 && count < 5) cls = 'heat-1';
    else if(count >= 5 && count < 10) cls = 'heat-2';
    else if(count >= 10) cls = 'heat-3';
    cells += `<div class="heat-cell ${cls}" title="${key}: ${count}"></div>`;
  }
  return `<div class="heatmap">${cells}</div>`;
}

async function switchProfile(p){
  if(p === currentProfile) return;
  currentProfile = p;
  localStorage.setItem('aleman_active_profile', p);
  progress = await loadProgress();
  streak = await loadStreak();
  selectedCategories = loadCategories();
  selectedLevels = loadLevels();
  mistakes = loadMistakes();
  await pullProfileFromCloud(); // overwrites with the latest synced data if available
  renderHome();
}

function categoryStats(cat){
  let total = 0, mastered = 0;
  DECK.forEach((card, idx) => {
    if(card.cat === cat){
      total++;
      const st = progress[idx];
      if(st && st.box >= 4) mastered++;
    }
  });
  return {mastered, total};
}

function normalizeAnswer(s){
  return s.trim().toLowerCase().replace(/\s+/g, ' ');
}
function isAnswerCorrect(given, expectedRaw){
  const alternatives = expectedRaw.split('/').map(s => normalizeAnswer(s));
  return alternatives.includes(normalizeAnswer(given));
}

            <div class="word-cat">${catLabel}</div>
          </div>
        </div>

      <div class="tap-hint">${hint}</div>

      <input type="text" id="answerInput" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
        placeholder="${direction === 'es-de' ? (isNoun ? 'der / die / das ...' : 'escribe aquí') : 'escribe aquí'}"
        style="width:100%; padding:14px; font-size:1.1rem; border-radius:14px; border:2px solid var(--cream2); margin-bottom:10px; text-align:center; font-weight:600; color:var(--brown);">

      <div style="display:flex; gap:6px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;">
        ${["á","é","í","ó","ú","ñ","ü"].map(ch => `<button class="btn btn-secondary" style="width:44px; padding:10px 0;" data-ch="${ch}">${ch}</button>`).join('')}
      </div>`}

      <button class="btn btn-primary" id="checkBtn">Comprobar</button>
      <div id="feedbackBox" style="display:none; margin-top:14px;"></div>
    </div>

  document.querySelectorAll('[data-ch]').forEach(btn=>{
    btn.onclick = () => {
      const input = document.getElementById('answerInput');
      const pos = input.selectionStart ?? input.value.length;

  input.focus();

function buildChoiceOptions(card, direction){
  const correctRaw = direction === "es-de" ? card.g : card.es;
  const correct = correctRaw.split('/')[0].trim(); // use first alternative as canonical display
  const pool = DECK.filter(c => c !== card && c.t === card.t); // prefer same word-type distractors
  const usable = pool.length >= 3 ? pool : DECK.filter(c => c !== card);
  const shuffledPool = [...usable].sort(() => Math.random() - 0.5);
  const distractors = [];
  const seen = new Set([normalizeAnswer(correct)]);
  for(const c of shuffledPool){
    const val = (direction === "es-de" ? c.g : c.es).split('/')[0].trim();
    const key = normalizeAnswer(val);
    if(seen.has(key)) continue;
    seen.add(key);
    distractors.push(val);
    if(distractors.length === 3) break;
  }
  const options = [correct, ...distractors].sort(() => Math.random() - 0.5);
  return { correct, options };
}

function renderChoiceCard(idx, card, direction){
  const colors = TYPE_COLORS[card.t] || {bg:"#eee", fg:"#333"};
  const questionText = direction === "es-de" ? card.es : card.g;
  const questionSubtext = direction === "de-es" && card.info ? card.info : null;
  const useDE = currentProfile === 'Heiko' || currentProfile === 'Ben';
  const catLabel = useDE ? (CATEGORY_DE[card.cat] || card.cat) : card.cat;
  const { correct, options } = buildChoiceOptions(card, direction);

  app.innerHTML = `
    <div class="card-surface" style="padding-bottom:8px;">
      <div class="subtitle" style="text-align:center; margin-bottom:10px;">⚡ Ronda rápida · ${PROFILES[currentProfile].name} · Tarjeta ${sessionIndex+1} de ${sessionQueue.length}</div>
      <div class="progress-bar-track" style="margin:0 0 16px;">
        <div class="progress-bar-fill" style="width:${(sessionIndex/sessionQueue.length)*100}%"></div>
      </div>

      <div class="flip-card" id="flipCard" style="cursor:default;">
        <div class="flip-inner">
          <div class="flip-face flip-front">
            <span class="tag" style="color:${colors.fg}">${card.t}</span>
            <div class="word-main">${questionText}</div>
            ${questionSubtext ? `<div class="word-info">${questionSubtext}</div>` : ''}
            <div class="word-cat">${catLabel}</div>
          </div>
        </div>
      </div>
      <div class="tap-hint">Elige la traducción correcta</div>

      <div id="choiceOptions">
        ${options.map((opt, i) => `<button class="btn btn-secondary choice-opt" data-opt="${encodeURIComponent(opt)}" style="margin-bottom:10px; text-align:left;">${opt}</button>`).join('')}
      </div>
      <div id="feedbackBox" style="display:none; margin-top:4px;"></div>

  document.querySelectorAll('.choice-opt').forEach(btn => {
    btn.onclick = () => checkChoiceAnswer(idx, card, direction, decodeURIComponent(btn.dataset.opt), correct, btn);
  });

function checkChoiceAnswer(idx, card, direction, chosen, correct, clickedBtn){
  if(clickedBtn.disabled) return;
  const isCorrect = normalizeAnswer(chosen) === normalizeAnswer(correct);
  const speakLang = direction === "es-de" ? "de-DE" : "es-ES";

  document.querySelectorAll('.choice-opt').forEach(btn => {
    btn.disabled = true;
    const val = decodeURIComponent(btn.dataset.opt);
    if(normalizeAnswer(val) === normalizeAnswer(correct)){
      btn.style.borderColor = 'var(--green)';
      btn.style.background = '#E9F5EE';
    } else if(btn === clickedBtn){
      btn.style.borderColor = 'var(--red)';
      btn.style.background = '#FBEAEA';
    }
  });

  if(navigator.vibrate) navigator.vibrate(isCorrect ? 40 : [30,40,30]);

  const expectedRaw = direction === "es-de" ? card.g : card.es;
  const box = document.getElementById('feedbackBox');
  box.style.display = 'block';
  box.innerHTML = `
    <div style="text-align:center; font-weight:800; color:${isCorrect ? 'var(--green)' : 'var(--red)'}; margin:10px 0;">
      ${isCorrect ? '✓ ¡Correcto!' : '✗ No exactamente'}
    </div>
    <button class="btn btn-primary" id="nextBtn">Siguiente</button>
  `;
  document.getElementById('nextBtn').onclick = () => answer(idx, isCorrect);
  speakWord(expectedRaw, speakLang);
  box.scrollIntoView({behavior:'smooth', block:'end'});
}


let cachedVoices = [];
function refreshVoices(){
  try{ cachedVoices = window.speechSynthesis.getVoices() || []; }catch(e){}
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickVoice(lang){
  if(!cachedVoices.length) refreshVoices();
  // Exact match first (e.g. es-ES, de-DE)
  let voice = cachedVoices.find(v => v.lang === lang);
  // Then same language family but explicitly avoid Latin American Spanish variants
  if(!voice && lang === 'es-ES'){
    voice = cachedVoices.find(v => v.lang.toLowerCase() === 'es-es' || /spain|españa/i.test(v.name));
  }
  // Fallback: any voice for that language prefix
  if(!voice){
    const prefix = lang.split('-')[0];
    voice = cachedVoices.find(v => v.lang.toLowerCase().startsWith(prefix));
  }
  return voice;
}

function speakWord(text, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel(); // stop any previous utterance
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang; // 'de-DE' or 'es-ES'
    const voice = pickVoice(lang);
    if(voice) utter.voice = voice;
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}

function checkAnswer(idx, card, direction){
  const input = document.getElementById('answerInput');
  if(input.disabled) return;
  const expectedRaw = direction === "es-de" ? card.g : card.es;
  const given = input.value;
  const isCorrect = given.trim().length > 0 && isAnswerCorrect(given, expectedRaw);
  const speakLang = direction === "es-de" ? "de-DE" : "es-ES";

  if(isCorrect){
    if(navigator.vibrate) navigator.vibrate(40);
  } else {
    if(navigator.vibrate) navigator.vibrate([30, 40, 30]);
  }

  input.disabled = true;
  document.getElementById('checkBtn').disabled = true;
  document.querySelectorAll('[data-ch]').forEach(b => b.disabled = true);
  input.style.borderColor = isCorrect ? 'var(--green)' : 'var(--red)';

  const box = document.getElementById('feedbackBox');
  box.style.display = 'block';
  box.innerHTML = `
    <div class="card-surface" style="background:${isCorrect ? '#E9F5EE' : '#FBEAEA'}; box-shadow:none; padding:16px; margin-bottom:0;">
      <div style="font-weight:800; color:${isCorrect ? 'var(--green)' : 'var(--red)'}; margin-bottom:6px;">
        ${isCorrect ? '✓ ¡Correcto!' : '✗ No exactamente'}
      </div>
      <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
        <div style="font-size:1.2rem; font-weight:800; color:var(--navy);">${expectedRaw}</div>
        <button id="speakBtn" title="Escuchar pronunciación" style="background:none; border:none; font-size:1.3rem; cursor:pointer; padding:0;">🔊</button>
      </div>
      ${direction === "es-de" && card.info ? `<div class="word-info">${card.info}</div>` : ''}
    </div>
    <button class="btn btn-primary" id="nextBtn" style="margin-top:14px;">Siguiente</button>
  `;
  document.getElementById('nextBtn').onclick = () => answer(idx, isCorrect);
  const speakBtn = document.getElementById('speakBtn');
  if(speakBtn) speakBtn.onclick = () => speakWord(expectedRaw, speakLang);
  speakWord(expectedRaw, speakLang); // auto-play once so you hear it immediately
  box.scrollIntoView({behavior:'smooth', block:'end'});
}

async function answer(idx, correct){
  const today = todayStr();
  let st = progress[idx] || {box:0, due:today};
  const wasMastered = (st.box || 0) >= 4;
  if(correct){
    st.box = Math.min(5, (st.box||0) + 1);
    sessionCorrect++;
    if(mistakes.includes(idx)){
      mistakes = mistakes.filter(m => m !== idx);
      saveMistakes(mistakes);
    }
  } else {
    st.box = 1;
    if(!mistakes.includes(idx)){
      mistakes.push(idx);
      saveMistakes(mistakes);
    }
  }
  st.due = addDays(today, INTERVALS[st.box] || 1);
  progress[idx] = st;
  sessionTotal++;
  streak.totalReviews = (streak.totalReviews || 0) + 1;
  ensureMonthlyReset(streak);
  if(!wasMastered && st.box >= 4){
    streak.monthlyMastered = (streak.monthlyMastered || 0) + 1;
  }
  await saveProgress(progress);
  await saveStreak(streak);

  sessionIndex++;
  renderCard();
}

async function renderSummary(){
  const today = todayStr();
  // update streak
  if(streak.lastDate !== today){
    if(streak.lastDate && daysBetween(streak.lastDate, today) === 1){
      streak.current += 1;
    } else if(!streak.lastDate || daysBetween(streak.lastDate, today) !== 0){
      streak.current = 1;
    }
    streak.lastDate = today;
    streak.longest = Math.max(streak.longest, streak.current);
  }
  streak.history[today] = (streak.history[today] || 0) + sessionTotal;
  await saveStreak(streak);
  syncProfileToCloud(); // fire and forget — updates the shared bin so the other profile can see progress

  const shareText = `${PROFILES[currentProfile].name}: hoy llevo ${streak.current} día${streak.current===1?'':'s'} seguido${streak.current===1?'':'s'} aprendiendo alemán 🇩🇪 (${sessionCorrect}/${sessionTotal} tarjetas hoy)`;
  const isPerfect = sessionTotal > 0 && sessionCorrect === sessionTotal;
  const headerEmoji = isPerfect ? '🎉' : (sessionCorrect >= sessionTotal * 0.7 ? '💪' : '🌱');
  const headerText = isPerfect
    ? '¡Ronda perfecta!'
    : (sessionCorrect >= sessionTotal * 0.7 ? '¡Sesión completada!' : 'Sesión completada — mañana mejor');

  const useDE = currentProfile === 'Heiko' || currentProfile === 'Ben';

  app.innerHTML = `
    <div class="card-surface" style="text-align:center;">
      <div style="font-size:3rem; margin-bottom:6px;">${headerEmoji}</div>
      <h1>${headerText}</h1>
      <div class="subtitle">${sessionCorrect} de ${sessionTotal} correctas</div>

      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-num"><span class="icon-flame">🔥</span>${streak.current}</div>
          <div class="stat-label">racha actual</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${streak.longest}</div>
          <div class="stat-label">racha máxima</div>
        </div>
      </div>

      <div class="share-box">
        💬 Cuéntaselo al equipo — es lo que de verdad sostiene la racha:
        <br><br>
        <em>"${shareText}"</em>
      </div>

      <button class="btn btn-primary" id="homeBtn">Volver al inicio</button>
      ${mistakes.length > 0 ? `<button class="btn btn-no" id="reviewMistakesBtn" style="margin-top:10px;">${useDE ? `🔁 Fehler wiederholen (${mistakes.length})` : `🔁 Repasar fallos (${mistakes.length})`}</button>` : ''}
    </div>
  `;
  document.getElementById('homeBtn').onclick = renderHome;
  const reviewMistakesBtn = document.getElementById('reviewMistakesBtn');
  if(reviewMistakesBtn) reviewMistakesBtn.onclick = startMistakesSession;
  if(isPerfect) launchConfetti();
}

function launchConfetti(){
  const colors = ['#B8860B', '#1F3864', '#2E7D4F', '#E8A33D', '#8B2B2B'];
  const count = 60;
  for(let i = 0; i < count; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    piece.style.animationDelay = (Math.random() * 0.4) + 's';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4200);
  }
}

function confirmReset(){
  app.innerHTML += `
    <div class="card-surface" id="confirmBox">
      <div class="subtitle" style="margin-bottom:12px; color:var(--red); font-weight:600;">
        ¿Seguro? Esto borra todo tu progreso y tu racha, no se puede deshacer.
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="cancelReset">Cancelar</button>
        <button class="btn btn-no" id="confirmResetBtn">Sí, borrar todo</button>
      </div>
    </div>
  `;
  document.getElementById('cancelReset').onclick = renderHome;
  document.getElementById('confirmResetBtn').onclick = doReset;
}

async function doReset(){
  progress = {};
  streak = {current:0, longest:0, lastDate:null, history:{}, totalReviews:0, monthlyMastered:0, monthKey:null, monthlyHistory:{}};
  mistakes = [];
  await saveProgress(progress);
  await saveStreak(streak);
  saveMistakes(mistakes);
  syncProfileToCloud(); // push the reset to the shared bin too
  renderHome();
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulario</title>
<style>
  :root{
    --cream:#FBF6EE; --cream2:#F3E9D8; --brown:#4A2E1F; --brown-light:#7A5240;
    --amber:#B8860B; --amber-dark:#8C6608; --navy:#1F3864; --green:#2E7D4F;
    --red:#B23A3A; --grey:#8A7F72; --white:#FFFFFF;
    --shadow: 0 4px 20px rgba(74,46,31,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background: linear-gradient(180deg,#FBF6EE 0%, #F3E9D8 100%);
    color:var(--brown);
    min-height:100vh;
    padding:16px;
  }
  .app{max-width:480px; margin:0 auto;}
  .card-surface{
    background:var(--white); border-radius:20px; box-shadow:var(--shadow);
    padding:24px; margin-bottom:16px;
  }
  h1{font-size:1.4rem; margin:0 0 4px; color:var(--brown);}
  .subtitle{color:var(--grey); font-size:0.9rem; margin-bottom:16px;}
  .greeting{
    display:flex; align-items:center; gap:10px; margin-bottom:6px;
  }
  .greeting .emoji{font-size:2rem;}
  .stat-row{display:flex; gap:10px; margin:16px 0;}
  .stat-box{
    flex:1; background:var(--cream2); border-radius:14px; padding:12px 8px;
    text-align:center;
  }
  .stat-num{font-size:1.5rem; font-weight:800; color:var(--amber-dark);}
  .stat-label{font-size:0.7rem; color:var(--grey); margin-top:2px; text-transform:uppercase; letter-spacing:0.03em;}
  .btn{
    display:block; width:100%; border:none; border-radius:14px; padding:16px;
    font-size:1.05rem; font-weight:700; cursor:pointer; text-align:center;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--amber); color:#fff;}
  .btn-secondary{background:var(--cream2); color:var(--brown);}
  .btn-outline{background:transparent; border:2px solid var(--cream2); color:var(--brown-light);}
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .btn-row .btn{flex:1;}
  .btn-ok{background:var(--green); color:#fff;}
  .btn-no{background:var(--red); color:#fff;}
  .btn:disabled{opacity:0.5; cursor:default;}

  .heatmap{display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; margin-top:10px;}
  .heat-cell{aspect-ratio:1; border-radius:4px; background:var(--cream2);}
  .heat-0{background:#EFE6D6;}
  .heat-1{background:#E3C98A;}
  .heat-2{background:#D4A94D;}
  .heat-3{background:var(--amber-dark);}

  .flip-card{
    margin-bottom:6px;
  }
  .flip-inner{
    position:relative; width:100%; text-align:center; border-radius:20px;
  }
  .flip-face{
    width:100%; min-height:180px;
    border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; box-shadow:var(--shadow); position:relative;
  }
  .flip-front{background:var(--white);}
  .flip-back{background:var(--navy); color:#fff;}
  .tag{
    position:absolute; top:14px; left:16px; font-size:0.65rem; font-weight:800;
    letter-spacing:0.05em; text-transform:uppercase; opacity:0.6;
  }
  .progress-count{
    position:absolute; top:14px; right:16px; font-size:0.7rem; opacity:0.6; font-weight:600;
  }
  .word-main{font-size:1.9rem; font-weight:800; color:var(--navy); margin-bottom:8px;}
  .flip-back .word-main{color:#fff;}
  .word-info{font-size:0.85rem; color:var(--grey); font-style:italic;}
  .word-cat{font-size:0.7rem; color:var(--grey); margin-top:14px;}
  .tap-hint{font-size:0.75rem; color:var(--grey); text-align:center; margin-bottom:16px;}

  .progress-bar-track{
    height:6px; background:var(--cream2); border-radius:3px; overflow:hidden; margin:14px 0;
  }
  .progress-bar-fill{height:100%; background:var(--amber); transition:width 0.3s ease;}

  .reward-bar-wrap{ position:relative; margin:34px 0 18px; }
  .reward-bar-track{ height:10px; background:var(--cream2); border-radius:5px; overflow:hidden; }
  .reward-bar-fill{ height:100%; background:linear-gradient(90deg, var(--amber), #E8A33D); transition:width 0.4s ease; }
  .reward-icon{
    position:absolute; top:-24px; transform:translateX(-50%);
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:1rem; border:2px solid var(--white); box-shadow:0 2px 6px rgba(0,0,0,0.15);
    cursor:default; background:var(--cream2); opacity:0.55;
  }
  .reward-icon.unlocked{ background:var(--amber); opacity:1; cursor:pointer; animation:reward-pop 0.4s ease; }
  .reward-icon.unlocked:active{ transform:translateX(-50%) scale(0.9); }
  @keyframes reward-pop{ 0%{ transform:translateX(-50%) scale(0.4); } 70%{ transform:translateX(-50%) scale(1.15); } 100%{ transform:translateX(-50%) scale(1); } }

  .reward-modal-backdrop{
    position:fixed; inset:0; background:rgba(74,46,31,0.55); display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:999;
  }
  .reward-modal-card{
    background:var(--white); border-radius:20px; padding:32px 24px; text-align:center; max-width:380px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3); animation:reward-modal-in 0.35s ease;
  }
  @keyframes reward-modal-in{ 0%{ transform:scale(0.7); opacity:0; } 100%{ transform:scale(1); opacity:1; } }

  .confetti-piece{
    position:fixed; top:-20px; width:9px; height:14px; opacity:0.9; z-index:1000; pointer-events:none;
    animation-name:confetti-fall; animation-timing-function:cubic-bezier(0.4,0.0,0.6,1); animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(105vh) rotate(540deg); opacity:0.3; }
  }

  .share-box{
    background:var(--cream2); border-radius:14px; padding:16px; margin:16px 0;
    font-size:0.95rem; line-height:1.5;
  }
  .footer-note{text-align:center; color:var(--grey); font-size:0.75rem; margin-top:20px; line-height:1.5;}
  .icon-flame{font-size:1.3rem;}
  .empty-state{text-align:center; padding:20px 0; color:var(--grey);}
  .type-badge{
    display:inline-block; font-size:0.65rem; font-weight:800; padding:3px 8px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:8px;
  }
  a{color:var(--amber-dark);}
</style>
</head>

function renderRewardBar(masteredTotal){
  const set = REWARD_SETS[currentProfile];
  if(!set) return '';
  const rewards = set.rewards;
  const maxMilestone = rewards[rewards.length - 1].milestone;
  const pct = Math.min(100, (masteredTotal / maxMilestone) * 100);
  const icons = rewards.map((r, i) => {
    const unlocked = masteredTotal >= r.milestone;
    const left = (r.milestone / maxMilestone) * 100;
    return `<div class="reward-icon ${unlocked ? 'unlocked' : ''}" style="left:${left}%;" data-reward-idx="${i}" data-unlocked="${unlocked}">${unlocked ? set.icon : '🔒'}</div>`;
  }).join('');
  const nextMilestone = rewards.find(r => masteredTotal < r.milestone);
  const statusLine = nextMilestone
    ? `🎁 Te faltan <b>${nextMilestone.milestone - masteredTotal}</b> palabras para la siguiente recompensa`
    : `🎁 ¡Has desbloqueado todas las recompensas!`;
  return `
    <div class="reward-bar-wrap">
      <div class="reward-bar-track"><div class="reward-bar-fill" style="width:${pct}%"></div></div>
      ${icons}
    </div>
    <div class="subtitle" style="margin-bottom:0;">${statusLine}</div>
  `;
}

function wireRewardIcons(){
  document.querySelectorAll('.reward-icon').forEach(icon => {

        showRewardModal(Number(icon.dataset.rewardIdx));
      }

  });
}

function showRewardModal(idx){
  const set = REWARD_SETS[currentProfile];
  if(!set) return;
  const r = set.rewards[idx];
  const backdrop = document.createElement('div');
  backdrop.className = 'reward-modal-backdrop';
  backdrop.innerHTML = `
    <div class="reward-modal-card">
      <div style="font-size:3.5rem; margin-bottom:10px;">${set.modalEmoji}</div>
      <div style="font-size:1.15rem; font-weight:800; color:var(--brown); line-height:1.5;">${r.text} ${r.emoji}</div>
      <div class="subtitle" style="margin:10px 0 20px;">Hito de ${r.milestone} palabras dominadas</div>
      <button class="btn btn-primary" id="closeRewardModal">¡Genial!</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.querySelector('#closeRewardModal').onclick = close;
  backdrop.onclick = (e) => { if(e.target === backdrop) close(); };
}

function getFilteredIndices(){
  const catAll = !selectedCategories || selectedCategories.length === 0 || selectedCategories.length === ALL_CATEGORIES.length;
  const lvlAll = !selectedLevels || selectedLevels.length === 0 || selectedLevels.length === ALL_LEVELS.length;
  if(catAll && lvlAll){
    return DECK.map((_, idx) => idx);
  }
  const catSet = catAll ? null : new Set(selectedCategories);
  const lvlSet = lvlAll ? null : new Set(selectedLevels);
  const out = [];
  DECK.forEach((card, idx) => {
    if(catSet && !catSet.has(card.cat)) return;
    if(lvlSet && !lvlSet.has(card.lvl)) return;
    out.push(idx);
  });
  return out;
}

const IN_PROGRESS_CAP = 100;

function getDueCards(){
  const today = todayStr();
  const indices = getFilteredIndices();
  const due = [];
  const fresh = [];
  indices.forEach(idx=>{
    const card = DECK[idx];
    const st = progress[idx];
    if(!st){ fresh.push(idx); }
    else if(st.due <= today){ due.push(idx); }
  });
  // prioritize reviews due, then fill with fresh new words — unless the
  // in-progress cap has been reached, in which case only due reviews are offered.
  const queue = due.slice(0, SESSION_SIZE);
  if(queue.length < SESSION_SIZE && countInProgress() < IN_PROGRESS_CAP){
    queue.push(...fresh.slice(0, SESSION_SIZE - queue.length));
  }
  return queue;
}

function countMastered(){
  const indices = new Set(getFilteredIndices());
  return Object.entries(progress).filter(([idx, s]) => indices.has(Number(idx)) && s.box >= 4).length;
}
function countInProgress(){
  const indices = new Set(getFilteredIndices());
  return Object.entries(progress).filter(([idx, s]) => indices.has(Number(idx)) && s.box >= 1 && s.box < 4).length;
}
function countReviewedTotal(){
  const indices = new Set(getFilteredIndices());
  return Object.keys(progress).filter(idx => indices.has(Number(idx))).length;
}

function renderHeatmap(history){

    if(count >= 1 && count < 5) cls = 'heat-1';
    else if(count >= 5 && count < 10) cls = 'heat-2';
    else if(count >= 10) cls = 'heat-3';
    cells += `<div class="heat-cell ${cls}" title="${key}: ${count}"></div>`;
  }
  return `<div class="heatmap">${cells}</div>`;
}

  return s.trim().toLowerCase().replace(/\s+/g, ' ');

  const alternatives = expectedRaw.split('/').map(s => normalizeAnswer(s));

function buildChoiceOptions(card, direction){
  const correctRaw = direction === "es-de" ? card.g : card.es;
  const correct = correctRaw.split('/')[0].trim(); // use first alternative as canonical display
  const pool = DECK.filter(c => c !== card && c.t === card.t); // prefer same word-type distractors
  const usable = pool.length >= 3 ? pool : DECK.filter(c => c !== card);
  const shuffledPool = [...usable].sort(() => Math.random() - 0.5);
  const distractors = [];
  const seen = new Set([normalizeAnswer(correct)]);
  for(const c of shuffledPool){
    const val = (direction === "es-de" ? c.g : c.es).split('/')[0].trim();
    const key = normalizeAnswer(val);
    if(seen.has(key)) continue;
    seen.add(key);
    distractors.push(val);
    if(distractors.length === 3) break;
  }
  const options = [correct, ...distractors].sort(() => Math.random() - 0.5);
  return { correct, options };
}

let cachedVoices = [];
function refreshVoices(){
  try{ cachedVoices = window.speechSynthesis.getVoices() || []; }catch(e){}
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickVoice(lang){
  if(!cachedVoices.length) refreshVoices();
  // Exact match first (e.g. es-ES, de-DE)
  let voice = cachedVoices.find(v => v.lang === lang);
  // Then same language family but explicitly avoid Latin American Spanish variants
  if(!voice && lang === 'es-ES'){
    voice = cachedVoices.find(v => v.lang.toLowerCase() === 'es-es' || /spain|españa/i.test(v.name));
  }
  // Fallback: any voice for that language prefix
  if(!voice){
    const prefix = lang.split('-')[0];
    voice = cachedVoices.find(v => v.lang.toLowerCase().startsWith(prefix));
  }
  return voice;
}

function speakWord(text, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel(); // stop any previous utterance
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang; // 'de-DE' or 'es-ES'
    const voice = pickVoice(lang);
    if(voice) utter.voice = voice;
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}

function checkAnswer(idx, card, direction){
  const input = document.getElementById('answerInput');
  if(input.disabled) return;
  const expectedRaw = direction === "es-de" ? card.g : card.es;
  const given = input.value;
  const isCorrect = given.trim().length > 0 && isAnswerCorrect(given, expectedRaw);
  const speakLang = direction === "es-de" ? "de-DE" : "es-ES";

  if(isCorrect){
    if(navigator.vibrate) navigator.vibrate(40);
  } else {
    if(navigator.vibrate) navigator.vibrate([30, 40, 30]);
  }

  input.disabled = true;
  document.getElementById('checkBtn').disabled = true;
  document.querySelectorAll('[data-ch]').forEach(b => b.disabled = true);
  input.style.borderColor = isCorrect ? 'var(--green)' : 'var(--red)';

  const box = document.getElementById('feedbackBox');
  box.style.display = 'block';
  box.innerHTML = `
    <div class="card-surface" style="background:${isCorrect ? '#E9F5EE' : '#FBEAEA'}; box-shadow:none; padding:16px; margin-bottom:0;">

  const speakBtn = document.getElementById('speakBtn');

  speakWord(expectedRaw, speakLang); // auto-play once so you hear it immediately
  box.scrollIntoView({behavior:'smooth', block:'end'});

async function answer(idx, correct){
  const today = todayStr();
  let st = progress[idx] || {box:0, due:today};
  const wasMastered = (st.box || 0) >= 4;
  if(correct){
    st.box = Math.min(5, (st.box||0) + 1);
    sessionCorrect++;
    if(mistakes.includes(idx)){
      mistakes = mistakes.filter(m => m !== idx);
      saveMistakes(mistakes);
    }
  } else {
    st.box = 1;
    if(!mistakes.includes(idx)){
      mistakes.push(idx);
      saveMistakes(mistakes);
    }
  }
  st.due = addDays(today, INTERVALS[st.box] || 1);
  progress[idx] = st;
  sessionTotal++;
  streak.totalReviews = (streak.totalReviews || 0) + 1;
  ensureMonthlyReset(streak);
  if(!wasMastered && st.box >= 4){
    streak.monthlyMastered = (streak.monthlyMastered || 0) + 1;
  }
  await saveProgress(progress);
  await saveStreak(streak);

  sessionIndex++;
  renderCard();
}

async function renderSummary(){
  const today = todayStr();
  // update streak
  if(streak.lastDate !== today){
    if(streak.lastDate && daysBetween(streak.lastDate, today) === 1){
      streak.current += 1;
    } else if(!streak.lastDate || daysBetween(streak.lastDate, today) !== 0){
      streak.current = 1;
    }
    streak.lastDate = today;
    streak.longest = Math.max(streak.longest, streak.current);
  }
  streak.history[today] = (streak.history[today] || 0) + sessionTotal;
  await saveStreak(streak);
  syncProfileToCloud(); // fire and forget — updates the shared bin so the other profile can see progress

  const shareText = `${PROFILES[currentProfile].name}: hoy llevo ${streak.current} día${streak.current===1?'':'s'} seguido${streak.current===1?'':'s'} aprendiendo alemán 🇩🇪 (${sessionCorrect}/${sessionTotal} tarjetas hoy)`;
  const isPerfect = sessionTotal > 0 && sessionCorrect === sessionTotal;
  const headerEmoji = isPerfect ? '🎉' : (sessionCorrect >= sessionTotal * 0.7 ? '💪' : '🌱');
  const headerText = isPerfect
    ? '¡Ronda perfecta!'
    : (sessionCorrect >= sessionTotal * 0.7 ? '¡Sesión completada!' : 'Sesión completada — mañana mejor');

  app.innerHTML = `
    <div class="card-surface" style="text-align:center;">
      <div style="font-size:3rem; margin-bottom:6px;">${headerEmoji}</div>
      <h1>${headerText}</h1>
      <div class="subtitle">${sessionCorrect} de ${sessionTotal} correctas</div>

      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-num"><span class="icon-flame">🔥</span>${streak.current}</div>
          <div class="stat-label">racha actual</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${streak.longest}</div>
          <div class="stat-label">racha máxima</div>
        </div>
      </div>

      <div class="share-box">
        💬 Cuéntaselo al equipo — es lo que de verdad sostiene la racha:
        <br><br>
        <em>"${shareText}"</em>
      </div>

      <button class="btn btn-primary" id="homeBtn">Volver al inicio</button>
    </div>
  `;
  document.getElementById('homeBtn').onclick = renderHome;
  if(isPerfect) launchConfetti();
}

function launchConfetti(){
  const colors = ['#B8860B', '#1F3864', '#2E7D4F', '#E8A33D', '#8B2B2B'];
  const count = 60;
  for(let i = 0; i < count; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    piece.style.animationDelay = (Math.random() * 0.4) + 's';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4200);
  }
}

function confirmReset(){
  app.innerHTML += `
    <div class="card-surface" id="confirmBox">
      <div class="subtitle" style="margin-bottom:12px; color:var(--red); font-weight:600;">
        ¿Seguro? Esto borra todo tu progreso y tu racha, no se puede deshacer.
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="cancelReset">Cancelar</button>
        <button class="btn btn-no" id="confirmResetBtn">Sí, borrar todo</button>
      </div>
    </div>
  `;
  document.getElementById('cancelReset').onclick = renderHome;
  document.getElementById('confirmResetBtn').onclick = doReset;
}

async function doReset(){
  progress = {};
  streak = {current:0, longest:0, lastDate:null, history:{}, totalReviews:0, monthlyMastered:0, monthKey:null};
  mistakes = [];
  await saveProgress(progress);
  await saveStreak(streak);
  saveMistakes(mistakes);
  syncProfileToCloud(); // push the reset to the shared bin too
  renderHome();
}

// ---------- Init ----------
(async function init(){
  app.innerHTML = `<div class="card-surface"><div class="empty-state">Cargando tu progreso...</div></div>`;
  const savedProfile = localStorage.getItem('aleman_active_profile');
  if(savedProfile && PROFILES[savedProfile]) currentProfile = savedProfile;
  progress = await loadProgress();
  streak = await loadStreak();
  selectedCategories = loadCategories();
  selectedLevels = loadLevels();
  mistakes = loadMistakes();
  await pullProfileFromCloud(); // get the latest from the shared bin if reachable, else keep local data
  renderModeSelect();
})();
</script>
</body>
</html>
